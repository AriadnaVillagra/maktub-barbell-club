<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Planificación y seguimiento de entrenamiento de fuerza para clubes.">
  <meta name="theme-color" content="#B71C1C">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Maktub">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Maktub Barbell Club</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <!--
    Own app-shell service worker (see maktub_sw.js). The relative URL resolves
    against <base href>, so its scope is the deployment base path.

    Updates: the worker of a new deploy downloads in the background and waits.
    - If one is already waiting when the app opens (downloaded on an earlier
      visit), it is activated and the page reloads into it before anything is in use.
    - If one finishes downloading while the app is open, window.maktubUpdate says
      so and fires 'maktub-update'; the app offers "Actualizar", which calls
      maktubUpdate.apply(): the worker activates and the page reloads.
    Each time the app comes back to the foreground it checks for a new deploy.
  -->
  <script>
    window.maktubUpdate = { ready: false, worker: null, apply: function () {
      if (this.worker) this.worker.postMessage('skipWaiting');
    } };
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        // The first install also takes control (clients.claim); that one is not an update.
        var hadController = !!navigator.serviceWorker.controller;
        var reloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (!hadController || reloading) return;
          reloading = true;
          window.location.reload();
        });
        navigator.serviceWorker.register('maktub_sw.js').then(function (reg) {
          if (reg.waiting && hadController) {
            reg.waiting.postMessage('skipWaiting');
            return;
          }
          function announce(worker) {
            window.maktubUpdate.ready = true;
            window.maktubUpdate.worker = worker;
            window.dispatchEvent(new Event('maktub-update'));
          }
          if (reg.waiting) announce(reg.waiting);
          reg.addEventListener('updatefound', function () {
            var worker = reg.installing;
            if (!worker) return;
            worker.addEventListener('statechange', function () {
              if (worker.state === 'installed' && navigator.serviceWorker.controller) announce(worker);
            });
          });
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') reg.update().catch(function () {});
          });
        }).catch(function (e) {
          console.warn('Service worker registration failed:', e);
        });
      });
    }
  </script>
</body>
</html>
