name: maktub_frontend
description: App de seguimiento y diseño de planes de powerlifting de Maktub Barbell Club.
publish_to: none
resolution: workspace
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: 3.4.3
  go_router: 18.1.1
  google_identity_services_web: 0.3.3+1
  http: ^1.6.0
  maktub_core:
    path: ../../packages/maktub_core
  maktub_ui:
    path: ../../packages/maktub_ui
  shared_preferences: 2.5.6
  web: 1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
